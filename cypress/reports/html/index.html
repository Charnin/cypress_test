x27;contain&#x27;, &#x27;Username หรือ Password ไม่ถูกต้อง&#x27;);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;9fb632cb-43ae-4888-9428-db8f74036b65&quot;,&quot;parentUUID&quot;:&quot;abbc3c6e-60a3-4088-9e4c-7fd3c1faf15e&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;ควร Login สำเร็จ และเห็นหน้าจัดการบัญชี&quot;,&quot;fullTitle&quot;:&quot;ทดสอบระบบ Login และ การออกจากระบบ ควร Login สำเร็จ และเห็นหน้าจัดการบัญชี&quot;,&quot;timedOut&quot;:null,&quot;duration&quot;:607,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;fast&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;context&quot;:null,&quot;code&quot;:&quot;// 1. กรอกข้อมูลที่ถูกต้อง\ncy.get(&#x27;#username&#x27;).type(&#x27;Charnin&#x27;);\ncy.get(&#x27;#password&#x27;).type(&#x27;pass1234&#x27;);\n// ดักรอ API ให้ดึงข้อมูลบัญชีหลังล็อกอินเสร็จ\ncy.intercept(&#x27;GET&#x27;, &#x27;/api/v1/expenses&#x27;).as(&#x27;getExpenses&#x27;);\ncy.get(&#x27;#login-btn&#x27;).click();\n// 2. ตรวจสอบว่าหน้า Login หายไป และหน้าบัญชีโผล่มา\ncy.get(&#x27;#login-section&#x27;).should(&#x27;not.be.visible&#x27;);\ncy.get(&#x27;#expense-section&#x27;).should(&#x27;be.visible&#x27;);\n// 3. ตรวจสอบว่าข้อมูลแสดงผลปกติ\ncy.wait(&#x27;@getExpenses&#x27;);\ncy.get(&#x27;#total-amount&#x27;).should(&#x27;not.have.text&#x27;, &#x27;0&#x27;);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;631fc368-57d3-4fd8-8956-895675f023c3&quot;,&quot;parentUUID&quot;:&quot;abbc3c6e-60a3-4088-9e4c-7fd3c1faf15e&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;ควร Logout กลับมาหน้าแรกได้&quot;,&quot;fullTitle&quot;:&quot;ทดสอบระบบ Login และ การออกจากระบบ ควร Logout กลับมาหน้าแรกได้&quot;,&quot;timedOut&quot;:null,&quot;duration&quot;:638,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;fast&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;context&quot;:null,&quot;code&quot;:&quot;// ล็อกอินเข้าระบบก่อน\ncy.get(&#x27;#username&#x27;).type(&#x27;Charnin&#x27;);\ncy.get(&#x27;#password&#x27;).type(&#x27;pass1234&#x27;);\ncy.get(&#x27;#login-btn&#x27;).click();\n// ยืนยันว่าเข้าสู่ระบบแล้ว ค่อยกด Logout\ncy.get(&#x27;#expense-section&#x27;).should(&#x27;be.visible&#x27;);\ncy.get(&#x27;#logout-btn&#x27;).click();\n// ตรวจสอบว่าหน้าบัญชีโดนซ่อน และหน้า Login กลับมา\ncy.get(&#x27;#expense-section&#x27;).should(&#x27;not.be.visible&#x27;);\ncy.get(&#x27;#login-section&#x27;).should(&#x27;be.visible&#x27;);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;ef6daaba-ca49-4503-bc7c-0cd593fbffff&quot;,&quot;parentUUID&quot;:&quot;abbc3c6e-60a3-4088-9e4c-7fd3c1faf15e&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false}],&quot;suites&quot;:[{&quot;uuid&quot;:&quot;ab80b0e3-7ddc-4060-8f99-292f2a52e17b&quot;,&quot;title&quot;:&quot;ทดสอบการจัดการบัญชี (หลังจาก Login แล้ว)&quot;,&quot;fullFile&quot;:&quot;&quot;,&quot;file&quot;:&quot;&quot;,&quot;beforeHooks&quot;:[],&quot;afterHooks&quot;:[],&quot;tests&quot;:[{&quot;title&quot;:&quot;ควรเพิ่มรายการรายรับและรายจ่ายแบบปกติได้ถูกต้อง&quot;,&quot;fullTitle&quot;:&quot;ทดสอบระบบ Login และ การออกจากระบบ ทดสอบการจัดการบัญชี (หลังจาก Login แล้ว) ควรเพิ่มรายการรายรับและรายจ่ายแบบปกติได้ถูกต้อง&quot;,&quot;timedOut&quot;:null,&quot;duration&quot;:2117,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;fast&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;context&quot;:null,&quot;code&quot;:&quot;cy.get(&#x27;#total-amount&#x27;).should(&#x27;not.have.text&#x27;, &#x27;0&#x27;).then($total =&gt; {\n  const initialTotal = parseFloat($total.text()); // ดึงยอด 14500\n  // ใช้ Custom Command ที่เราสร้างไว้ให้เป็นประโยชน์!\n  cy.addExpense(&#x27;รับเงินค่าโปรเจกต์&#x27;, 5000);\n  cy.addExpense(&#x27;จ่ายค่าเน็ตบ้าน&#x27;, -1200);\n  const expectedTotal = initialTotal + 5000 - 1200;\n  cy.get(&#x27;#total-amount&#x27;).should(&#x27;have.text&#x27;, String(expectedTotal));\n  // ตรวจสอบ
